[package]
name = "rooms-hall"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "One room for an evening: one join link, and the host picks which game it plays."

[[bin]]
name = "rooms-hall"
path = "src/main.rs"

[dependencies]
axum = "0.8"
rooms = { path = "../rooms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
petrov = { git = "https://github.com/float3/petrov" }
numbers = { git = "https://github.com/float3/numbers" }
estimate = { git = "https://github.com/float3/estimate" }
updating = { git = "https://github.com/float3/updating" }

[build-dependencies]
rooms-client = { path = "../rooms-client" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
