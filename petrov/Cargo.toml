[package]
name = "petrov"
version = "0.1.0"
authors = ["hill <hill@hilll.dev>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/float3/rooms"

[build-dependencies]
rooms-client = { path = "../rooms-client" }

[dependencies]
axum = "0.8"
rand = "0.10"
rooms = { path = "../rooms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
argon2 = "0.6"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
