[package]
name = "order"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "One food order for a room of people: the menu's link, everybody's choices, and the whole order on the host's phone."

[[bin]]
name = "order"
path = "src/main.rs"

[build-dependencies]
rooms-client = { path = "../rooms-client" }

[dependencies]
axum = "0.8"
rooms = { path = "../rooms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
