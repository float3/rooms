name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test
        run: nix develop --command cargo test

      - name: Lint
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Check the formatting
        run: nix develop --command cargo fmt --check

      - name: Build the crate against its locked dependencies
        run: nix build --print-build-logs

      - name: Check the documentation
        run: nix develop --command cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
