name: CI

on:
  # Pushes to the default branch, and every pull request. Pushes to other
  # branches are left to their pull request: checking both ran every job
  # twice on the same commit.
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One job per check, so each shows up on its own in a pull request and they
# run side by side. Every Rust job runs in the flake's dev shell: the same
# rustc, clippy, esbuild and tsc as `nix develop` locally.
jobs:

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The target directory, between runs. The toolchain itself comes from
      # the flake's dev shell, so it matches what `nix build` uses.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test

      - name: Test every crate
        run: nix develop --command cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The target directory, between runs. The toolchain itself comes from
      # the flake's dev shell, so it matches what `nix build` uses.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy

      - name: Lint every crate and its tests
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the Rust formatting
        run: nix develop --command cargo fmt --all --check

      - name: Check the Nix formatting
        run: nix fmt -- --check .

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The target directory, between runs. The toolchain itself comes from
      # the flake's dev shell, so it matches what `nix build` uses.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: docs

      - name: Build the documentation
        run: nix develop --command cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the shared client strictly
        run: nix develop --command tsc --noEmit --strict --target es2020 --lib es2020,dom,dom.iterable rooms-client/client/rooms.ts

  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default is the two libraries; the rest are the servers.
        package: [default, hall, petrov, numbers, estimate, updating, order]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build against the locked dependencies, tests included
        run: nix build --print-build-logs .#${{ matrix.package }}

  nixos:
    name: NixOS modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate the NixOS modules together
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake "git+file://'"$PWD"'";
              system = flake.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  flake.nixosModules.hall
                  flake.nixosModules.petrov
                  flake.nixosModules.numbers
                  flake.nixosModules.estimate
                  flake.nixosModules.updating
                  flake.nixosModules.order
                  {
                    boot.isContainer = true;
                    system.stateVersion = "26.05";
                    services.nginx.enable = true;
                    security.acme.acceptTerms = true;
                    security.acme.defaults.email = "ci@example.com";
                    services.rooms-hall = { enable = true; domains = ["hall.example.com"]; };
                    services.petrov.sites = {
                      petrov = { port = 8095; domains = ["petrov.example.com"]; };
                      arkhipov = { brand = "arkhipov"; port = 8096; domains = ["arkhipov.example.com"]; };
                    };
                    services.numbers = { enable = true; domains = ["numbers.example.com"]; };
                    services.estimate = { enable = true; domains = ["estimate.example.com"]; };
                    services.updating = { enable = true; domains = ["updating.example.com"]; };
                    services.order = { enable = true; port = 8105; domains = ["order.example.com"]; };
                  }
                ];
              };
            in system.config.system.build.toplevel.drvPath'
